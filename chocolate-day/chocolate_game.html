<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All the Sweetness 🍫❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chocolate_style.css">
</head>
<body>
  <div class="container chocolate-game bounce-in">
    <h1 class="wiggle">Build Your Chocolate 🍫</h1>
    <div class="sweetness-bar"><div id="sweetFill"></div></div>
    <p id="sweetText">Sweetness: 0 / 7 🍫</p>
    <div class="ingredients" id="ingredients"></div>
    <button id="backBtn" class="back-btn hidden" onclick="goBackToLetter()">Back to Letter 💌</button>
  </div>

  <div id="fadeOverlay" class="chocolate-fade">
    <div class="chocolate-final">
      <div class="emoji">🍫❤️</div>
      <p>All the sweetness in my life 🍫✨<br>comes through you ❤️</p>
    </div>
  </div>

  <script src="chocolate_script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Choice 💍</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="propose_style.css">
</head>
<body>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="choice-container">
    <h1 class="wiggle">Before I ask you something important… 💍</h1>
    <p class="subtitle">Choose what feels right ❤️</p>

    <div class="choices" id="choices"></div>

    <div id="completionText" class="completion hidden">
      You chose all of these…<br>
      and I choose you. 💍❤️
    </div>

    <button id="backBtn" class="action-btn hidden" onclick="goBackToLetter()">
      Back to Letter 💌
    </button>

    <button class="reset-btn" onclick="resetChoices()">
      Reset Choices ♻️
    </button>
  </div>

  <!-- Fade Overlay -->
  <div id="fadeOverlay" class="fade-overlay hidden"></div>

  <script src="propose_script.js"></script>
</body>
</html>
